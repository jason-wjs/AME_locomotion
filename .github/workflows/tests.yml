name: Tests

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONPATH: tests
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          python-version: "3.11"
      - run: uv sync --locked
      - name: Configuration, observation, CLI and checkpoint contracts
        run: >-
          uv run --locked python -m unittest
          test_alignment test_cli test_variant_configs
          test_observation_contract test_runner_save_policy
